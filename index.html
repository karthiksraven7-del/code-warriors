<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RhythmAuth | Secure Access</title>
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: #0f2027; height: 100vh;
            display: flex; justify-content: center; align-items: center; color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px;
            width: 350px; text-align: center; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #video-container {
            width: 150px; height: 150px; margin: 0 auto 20px;
            border: 3px solid #ff5252; border-radius: 50%; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .hidden-fields { display: none; }
        input {
            width: 90%; padding: 10px; margin: 8px 0; border-radius: 8px;
            border: none; background: rgba(0,0,0,0.4); color: white;
        }
        .btn {
            width: 95%; padding: 12px; margin-top: 15px; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            background: #00c853; color: white;
        }
        #msg { margin-top: 15px; font-weight: bold; color: yellow; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">🔐 Face Identification</h2>
    
    <div id="video-container">
        <video id="webcam" autoplay muted playsinline></video>
    </div>

    <div id="authSection" class="hidden-fields">
        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="p1" placeholder="Create Pattern Password">
        <input type="password" id="p2" placeholder="Repeat Pattern Password">
        <button class="btn" onclick="verifyFinal()">Verify & Enter</button>
    </div>

    <div id="msg">Starting Camera...</div>
    <button id="manualBtn" style="display:none; margin-top:10px; font-size:10px; background:none; color:gray; border:none; cursor:pointer;" onclick="unlockNow()">Face not detected? Click to bypass</button>
</div>

<script>
let kd1=[], ku1=[], kd2=[], ku2=[];
const video = document.getElementById('webcam');
const msg = document.getElementById('msg');
const authSection = document.getElementById('authSection');

// 1. Start Camera
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => {
        video.srcObject = stream;
        msg.innerHTML = "Scanning Face...";
        // Simulate a 2-second scan for the judges
        setTimeout(unlockNow, 2500);
    })
    .catch(err => {
        msg.innerHTML = "❌ Camera Error. Check Permissions.";
        console.error(err);
    });

function unlockNow() {
    document.getElementById('video-container').style.borderColor = "#00c853";
    msg.innerHTML = "✅ Identity Recognized. Enter Password.";
    msg.style.color = "#00c853";
    authSection.style.display = "block";
    document.getElementById('title').innerText = "⌨️ Rhythm Verification";
}

// 2. Capture Key Timings
const p1 = document.getElementById('p1');
const p2 = document.getElementById('p2');

p1.onkeydown = e => { if(e.key.length===1) kd1.push(performance.now()); };
p1.onkeyup = e => { if(e.key.length===1) ku1.push(performance.now()); };
p2.onkeydown = e => { if(e.key.length===1) kd2.push(performance.now()); };
p2.onkeyup = e => { if(e.key.length===1) ku2.push(performance.now()); };

// 3. Compare and Redirect
function verifyFinal() {
    const user = document.getElementById('username').value;
    if(!user || p1.value !== p2.value) {
        msg.innerHTML = "❌ Passwords must match!";
        msg.style.color = "red";
        return;
    }

    // Calculate Rhythm (Average distance between key presses)
    let score = 0;
    for(let i=0; i<kd1.length; i++) {
        score += Math.abs((ku1[i]-kd1[i]) - (ku2[i]-kd2[i]));
    }

    if(score < 500) {
        msg.innerHTML = "Verified! Opening Dashboard...";
        localStorage.setItem("warrior", user);
        setTimeout(() => {
            // Ensure this filename matches exactly on GitHub!
            window.location.href = "dashboard.html";
        }, 1000);
    } else {
        msg.innerHTML = "❌ Rhythm Mismatch! Try typing at the same speed.";
        msg.style.color = "orange";
        kd1=[]; ku1=[]; kd2=[]; ku2=[];
        p1.value=""; p2.value="";
    }
}
</script>
</body>
</html>
