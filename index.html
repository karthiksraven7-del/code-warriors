<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RhythmAuth | Secure Access</title>
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle, #1e3c72, #2a5298); height: 100vh;
            display: flex; justify-content: center; align-items: center; color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.4); padding: 35px; border-radius: 25px;
            width: 360px; text-align: center; backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        #video-container {
            width: 140px; height: 140px; margin: 0 auto 20px;
            border: 4px solid #ff5252; border-radius: 50%; overflow: hidden;
            transition: 0.8s ease;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .input-area { display: none; }
        input {
            width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: none; background: rgba(255,255,255,0.1); color: white; outline: none;
        }
        .btn {
            width: 96%; padding: 14px; margin-top: 15px; border: none;
            border-radius: 10px; font-weight: bold; cursor: pointer;
            background: #00c853; color: white; font-size: 16px;
        }
        #msg { margin-top: 15px; font-weight: 500; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">Security Check</h2>
    <div id="video-container"><video id="webcam" autoplay muted playsinline></video></div>

    <div id="inputArea" class="input-area">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="p1" placeholder="Type Password">
        <input type="password" id="p2" placeholder="Repeat Password Exactly">
        <button class="btn" onclick="verifyBiometrics()">Verify & Access</button>
    </div>

    <div id="msg">Initializing AI...</div>
</div>

<script>
let r1 = [], r2 = [];
const video = document.getElementById('webcam');
const msg = document.getElementById('msg');
const inputArea = document.getElementById('inputArea');

// 1. Face Recognition Simulation
navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        video.srcObject = stream;
        setTimeout(() => {
            document.getElementById('video-container').style.borderColor = "#00c853";
            msg.innerHTML = "✅ Face Detected. Please enter rhythm.";
            msg.style.color = "#00e676";
            inputArea.style.display = "block";
            document.getElementById('title').innerText = "Step 2: Rhythm";
        }, 2000);
    })
    .catch(() => { msg.innerHTML = "❌ Please allow camera access!"; });

// 2. Capture Timings (Relative to the first keypress)
function recordRhythm(e, sequence) {
    if (e.type === "keydown" && !e.repeat) {
        let timestamp = performance.now();
        // If this is the first key, its relative time is 0
        let relativeTime = sequence.length === 0 ? 0 : timestamp - sequence[0].absolute;
        sequence.push({ absolute: timestamp, relative: relativeTime });
    }
}

const pass1 = document.getElementById('p1');
const pass2 = document.getElementById('p2');

pass1.addEventListener('keydown', (e) => recordRhythm(e, r1));
pass2.addEventListener('keydown', (e) => recordRhythm(e, r2));

// 3. Compare Rhythm
function verifyBiometrics() {
    const user = document.getElementById('username').value;
    
    if (r1.length === 0 || r1.length !== r2.length || pass1.value !== pass2.value) {
        msg.innerHTML = "❌ Typing mismatch or fields empty!";
        msg.style.color = "#ff5252";
        reset();
        return;
    }

    let totalDifference = 0;
    for (let i = 0; i < r1.length; i++) {
        totalDifference += Math.abs(r1[i].relative - r2[i].relative);
    }

    // averageDiff is the average millisecond error per key
    let averageDiff = totalDifference / r1.length;
    console.log("Rhythm Accuracy Score:", averageDiff);

    // THRESHOLD: 800 is very safe for a demo. 200 is for high-security.
    if (averageDiff < 800) {
        msg.innerHTML = "✅ Identity Confirmed!";
        msg.style.color = "#00e676";
        localStorage.setItem("warrior", user);
        setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
    } else {
        msg.innerHTML = "❌ Rhythm Denied! Score: " + Math.round(averageDiff);
        msg.style.color = "#ff9100";
        reset();
    }
}

function reset() {
    r1 = []; r2 = [];
    pass1.value = ""; pass2.value = "";
}
</script>
</body>
</html>
